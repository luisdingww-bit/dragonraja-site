<script>
var DATA=window.TIMELINE_DATA||[];
function L(o){ return (window.LANG==='en'&&o.en!==undefined)?o.en:o.zh; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function render(){
  var box=document.getElementById('timeline'); box.innerHTML='';
  DATA.forEach(function(n,i){
    var node=document.createElement('div'); node.className='tl-node';
    node.innerHTML=
      '<span class="tl-era">'+esc(L(n))+'</span>'+
      '<h3>'+esc(L({zh:n.title,en:n.title_en}))+'</h3>'+
      '<div class="tl-desc">'+esc(L({zh:n.desc,en:n.desc_en}))+'</div>'+
      '<button class="tl-more" type="button">'+(window.LANG==='en'?'Open dossier →':'展开档案 →')+'</button>';
    node.querySelector('.tl-more').onclick=function(){ openCard(n); };
    node.querySelector('h3').onclick=function(){ openCard(n); };
    box.appendChild(node);
  });
}
function openCard(n){
  var b=document.getElementById('tlBody');
  var tags=(n.tags||[]).map(function(t){ return '<span class="qc-tag">'+esc(t)+'</span>'; }).join('');
  var link=n.link
    ? '<a class="tl-sheet-link" href="'+esc(n.link.href)+'">'+esc(L(n.link))+' <span class="arr">→</span></a>'
    : '';
  b.innerHTML=
    '<div class="tl-sheet-era">'+esc(L(n))+(n.year!=='—'?' · '+esc(L({zh:n.year,en:n.year_en!==undefined?n.year_en:n.year})):'')+'</div>'+
    '<h3>'+esc(L({zh:n.title,en:n.title_en}))+'</h3>'+
    (n.img?'<div class="art-frame"><img src="'+esc(n.img)+'" alt=""><div class="cap">⟪ '+esc(L({zh:n.title,en:n.title_en}))+' ⟫</div></div>':'')+
    '<div class="tl-sheet-desc">'+esc(L({zh:n.desc,en:n.desc_en}))+'</div>'+
    (tags?'<div class="tl-sheet-tags">'+tags+'</div>':'')+
    link;
  var card=document.getElementById('tlCard');
  card.classList.add('show'); card.setAttribute('aria-hidden','false');
}
function closeCard(){
  var card=document.getElementById('tlCard');
  card.classList.remove('show'); card.setAttribute('aria-hidden','true');
}
document.getElementById('tlClose').onclick=closeCard;
document.getElementById('tlCard').addEventListener('click',function(e){ if(e.target.id==='tlCard') closeCard(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeCard(); });

render();
if(window.onLangChange)window.onLangChange(render);
</script>
