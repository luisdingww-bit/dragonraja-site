<script>
var DATA=window.QUOTES_DATA||[];
var PEOPLE=window.QUOTES_PEOPLE||{};
var THEMES=window.QUOTES_THEMES||{};
var VOLS=window.QUOTES_VOLUMES||{};
var curTheme='all', curPerson='all', curVol='all', favOnly=false;
var FAVKEY='dr-fav-quotes';
function favs(){ try{ return JSON.parse(localStorage.getItem(FAVKEY))||[]; }catch(e){ return []; } }
function saveFavs(a){ try{ localStorage.setItem(FAVKEY, JSON.stringify(a)); }catch(e){} }
function L(o){ return (window.LANG==='en'&&o.en!==undefined)?o.en:o.zh; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

/* 每日一句：按日期 seed 伪随机 */
function dailyIndex(){
  var d=new Date();
  return (d.getFullYear()*372 + (d.getMonth()+1)*31 + d.getDate()) % DATA.length;
}
function renderDaily(){
  var q=DATA[dailyIndex()];
  var p=PEOPLE[q.who]||{zh:'—',en:'—'};
  document.getElementById('qdText').textContent='「'+L(q)+'」';
  document.getElementById('qdWho').textContent=L(p)+' · '+(q.source?L({zh:q.source,en:q.source_en}):'')+' · '+L({zh:'每日一句',en:'Daily Quote'});
  var k=document.getElementById('qdKick');
  k.textContent=window.LANG==='en'?'— TODAY\'S QUOTE —':'— 每 日 一 句 · 今 日 留 声 —';
}

/* 筛选器 */
function buildFilters(){
  var tt=document.getElementById('themeTabs'); tt.innerHTML='';
  var all={zh:'全部',en:'All'};
  function mk(label,key,onclick){
    var b=document.createElement('button'); b.type='button'; b.className='ftab'+(onclick?' active':'');
    b.textContent=L(label); b.setAttribute('data-f',key);
    b.onclick=function(){ document.querySelectorAll('#themeTabs .ftab').forEach(function(x){x.classList.remove('active');}); b.classList.add('active'); curTheme=key; render(); };
    tt.appendChild(b);
  }
  mk(all,'all',true);
  Object.keys(THEMES).forEach(function(k){ mk(THEMES[k],k); });

  var ps=document.getElementById('qperson'); ps.innerHTML='';
  var o=document.createElement('option'); o.value='all'; o.textContent=L({zh:'全部人物',en:'All speakers'}); ps.appendChild(o);
  Object.keys(PEOPLE).forEach(function(k){
    var op=document.createElement('option'); op.value=k; op.textContent=L(PEOPLE[k]); ps.appendChild(op);
  });
  ps.onchange=function(){ curPerson=ps.value; render(); };

  var vs=document.getElementById('qvol'); vs.innerHTML='';
  var ov=document.createElement('option'); ov.value='all'; ov.textContent=L({zh:'全部卷次',en:'All volumes'}); vs.appendChild(ov);
  Object.keys(VOLS).forEach(function(k){
    var op=document.createElement('option'); op.value=k; op.textContent=L(VOLS[k]); vs.appendChild(op);
  });
  vs.onchange=function(){ curVol=vs.value; render(); };

  document.getElementById('favOnly').onclick=function(){
    favOnly=!favOnly; this.classList.toggle('active',favOnly); render();
  };
  document.getElementById('qsearch').addEventListener('input',function(){ render(); });
}

function match(){
  var q=document.getElementById('qsearch').value.trim().toLowerCase();
  return DATA.filter(function(x){
    if(curTheme!=='all'&&x.theme!==curTheme)return false;
    if(curPerson!=='all'&&x.who!==curPerson)return false;
    if(curVol!=='all'&&x.vol!==curVol)return false;
    if(favOnly&&favs().indexOf(x.id)<0)return false;
    if(q){
      var hay=(L(x)+' '+(L(PEOPLE[x.who]||{}))+' '+(x.source?L({zh:x.source,en:x.source_en}):'')).toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  });
}

function render(){
  var list=match();
  document.getElementById('qcount').textContent=window.t('count_tmpl').replace('{{n}}',list.length).replace('{{t}}',DATA.length);
  var g=document.getElementById('qgrid'); g.innerHTML='';
  if(!list.length){ g.innerHTML='<div class="empty">'+window.t('empty_tmpl')+'</div>'; return; }
  var fv=favs();
  list.forEach(function(x){
    var p=PEOPLE[x.who]||{zh:'—',en:'—'};
    var th=THEMES[x.theme]||{zh:'—',en:'—'};
    var vo=VOLS[x.vol]||{zh:'—',en:'—'};
    var on=fv.indexOf(x.id)>=0;
    var c=document.createElement('div'); c.className='quote-card';
    c.innerHTML=
      '<div class="qc-text">「'+esc(L(x))+'」</div>'+
      '<div class="qc-who">—— '+esc(L(p))+(x.source?' · '+esc(L({zh:x.source,en:x.source_en})):'')+'</div>'+
      '<div class="qc-meta">'+
        '<span class="qc-tag">'+esc(L(th))+'</span>'+
        '<span class="qc-tag">'+esc(L(vo))+'</span>'+
        '<button class="qc-fav'+(on?' on':'')+'" type="button">'+(on?(window.LANG==='en'?'♥ Faved':'♥ 已收藏'):(window.LANG==='en'?'♡ Fav':'♡ 收藏'))+'</button>'+
      '</div>';
    c.querySelector('.qc-fav').onclick=function(){
      var a=favs();
      var i=a.indexOf(x.id);
      if(i>=0)a.splice(i,1); else a.push(x.id);
      saveFavs(a);
      if(a.length>=5&&window.ACH)window.ACH.earn('quotes');
      render();
    };
    g.appendChild(c);
  });
}

/* 樱花彩蛋：搜索 绘梨衣 / sakura / 樱花 */
function sakura(){
  var n=16;
  for(var i=0;i<n;i++){
    var p=document.createElement('span'); p.className='sakura-petal';
    p.style.left=(Math.random()*100)+'vw';
    p.style.animationDuration=(Math.random()*3.4+2.4)+'s';
    p.style.animationDelay=(Math.random()*0.8)+'s';
    p.style.width=p.style.height=(Math.random()*5+6)+'px';
    document.body.appendChild(p);
    setTimeout(function(el){ if(el.parentNode)el.parentNode.removeChild(el); }, 6500);
  }
}
document.getElementById('qsearch').addEventListener('input',function(){
  var v=this.value.toLowerCase();
  if(/绘梨衣|sakura|樱花|eri/.test(v)) sakura();
});

buildFilters();
renderDaily();
render();
if(window.onLangChange)window.onLangChange(function(){ renderDaily(); buildFilters(); render(); });
</script>
