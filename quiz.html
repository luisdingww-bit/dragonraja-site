var pIdx=0, pAns={};
function prender(){
  var q=PQUESTIONS[pIdx];
  document.getElementById('pq').textContent='Q'+(pIdx+1)+' / 10 · '+L(q);
  var box=document.getElementById('popts'); box.innerHTML='';
  q.opts.forEach(function(o){
    var b=document.createElement('button'); b.type='button'; b.className='quiz-opt'+(pAns[pIdx]===o.t?' sel':'');
    b.textContent=L(o); b.onclick=function(){ pAns[pIdx]=o.t; prender(); };
    box.appendChild(b);
  });
  document.getElementById('pprogress').textContent=(pIdx+1)+' / 10';
  document.getElementById('pPrev').disabled=pIdx===0;
  if(pIdx===9){
    var n=document.getElementById('pNext');
    n.textContent=window.LANG==='en'?'See result →':'查看结果 →';
  }
}
function presult(){
  var score={mingfei:0,zihang:0,caesar:0,eri:0,mingze:0,zero:0};
  Object.keys(pAns).forEach(function(i){ var t=pAns[i]; if(score[t]!==undefined)score[t]++; });
  var best='mingfei',bm=0;
  Object.keys(score).forEach(function(k){ if(score[k]>bm){bm=score[k];best=k;} });
  var r=PTYPES[best];
  var box=document.getElementById('presult');
  box.classList.add('show');
  box.innerHTML=
    '<div class="qr-kick">'+(window.LANG==='en'?'YOUR HYBRID PROTOTYPE':'鉴 定 完 成 · 你 的 混 血 种 原 型')+'</div>'+
    '<div class="qr-title">'+esc(r.icon)+' '+esc(L(r))+'</div>'+
    '<div class="qr-desc">'+esc(L({zh:r.zh_d,en:r.en_d}))+'</div>'+
    '<div class="qr-foot">'+
      '<a class="qr-link" href="characters.html">'+(window.LANG==='en'?'Character Dossiers →':'前往人物交织网 →')+'</a>'+
      '<button class="qr-link" type="button" id="pRetry" style="cursor:pointer;">'+(window.LANG==='en'?'Retake':'重新测试')+'</button>'+
    '</div>';
  document.getElementById('pRetry').onclick=function(){ pIdx=0; pAns={}; document.getElementById('presult').classList.remove('show'); prender(); };
}
document.getElementById('pPrev').onclick=function(){ if(pIdx>0){pIdx--;prender();} };
document.getElementById('pNext').onclick=function(){
  if(pAns[pIdx]===undefined){ window.DR_ACC&&window.DR_ACC.toast(window.LANG==='en'?'Pick an answer first':'请先选择一个答案'); return; }
  if(pIdx===9){ presult(); return; }
  pIdx++; prender();
};

  document.getElementById('kPrev').disabled=true;
  document.getElementById('kNext').disabled=false;
  document.getElementById('kNext').textContent=window.LANG==='en'?'Next →':'下一题 →';
  krender();
}
function krender(){
  var q=ks[ki];
  document.getElementById('kq').textContent='Q'+(ki+1)+' / 10 · '+L(q);
  var box=document.getElementById('kopts'); box.innerHTML='';
  q.opts.forEach(function(o,i){
    var b=document.createElement('button'); b.type='button'; b.className='quiz-opt';
    b.textContent=String.fromCharCode(65+i)+'. '+L(o);
    b.onclick=function(){ pick(i); };
    box.appendChild(b);
  });
  document.getElementById('kprogress').textContent=(ki+1)+' / 10 · '+(window.LANG==='en'?'score':'得分')+' '+kscore;
  document.getElementById('kPrev').disabled=ki===0;
}
function pick(i){
  var q=ks[ki];
  if(kpicked!==null) return;
  kpicked=i;
  if(i===q.ans) kscore++;
  var box=document.getElementById('kopts');
  Array.prototype.forEach.call(box.children,function(b,idx){
    b.disabled=true;
    if(idx===q.ans){ b.classList.add('sel'); }
    else if(idx===i){ b.classList.add('sel'); b.style.borderColor='var(--blood)'; b.style.color='#eaa7b0'; }
  });
  document.getElementById('kprogress').textContent=(ki+1)+' / 10 · '+(window.LANG==='en'?'score':'得分')+' '+kscore+(i===q.ans?'':' · '+L({zh:'正确答案',en:'Correct answer'})+': '+String.fromCharCode(65+q.ans));
  var hint=document.createElement('div');
  hint.className='count-line'; hint.style.marginTop='14px';
  hint.textContent=L(q.hint);
  box.appendChild(hint);
  document.getElementById('kNext').textContent=(ki===9)?(window.LANG==='en'?'See result →':'查看结果 →'):(window.LANG==='en'?'Next →':'下一题 →');
}
document.getElementById('kPrev').onclick=function(){ if(ki>0){ki--;kpicked=null;document.getElementById('kNext').disabled=false;krender();} };
document.getElementById('kNext').onclick=function(){
  if(kpicked===null && ki<ks.length-1){ window.DR_ACC&&window.DR_ACC.toast(window.LANG==='en'?'Pick an answer first':'请先选择一个答案'); return; }
  if(ki<9){ ki++; kpicked=null; document.getElementById('kNext').disabled=false; krender(); }
  else kresult();
};
function krank(){
  var r=[
    { min:9, zh:'S 级 · 屠龙者之姿', en:'S-Class · Dragon-Slayer' },
    { min:7, zh:'A 级 · 执行部新星', en:'A-Class · Execution Rising Star' },
    { min:5, zh:'B 级 · 狮心会预备役', en:'B-Class · Lionheart Reserve' },
    { min:3, zh:'C 级 · 图书馆常驻', en:'C-Class · Library Regular' },
    { min:0, zh:'D 级 · 芬格尔的学弟', en:'D-Class · Fingel\'s Junior' }
  ];
  for(var i=0;i<r.length;i++){ if(kscore>=r[i].min) return r[i]; }
  return r[r.length-1];
}
function kresult(){
  var r=krank();
  var best=kscore>=3;
  try{ localStorage.setItem('dr-quiz-best', Math.max(kscore, Number(localStorage.getItem('dr-quiz-best'))||0)); }catch(e){}
  var box=document.getElementById('kresult');
  box.classList.add('show');
  box.innerHTML=
    '<div class="qr-kick">'+(window.LANG==='en'?'FINAL SCORE':'答 题 完 成 · 最 终 得 分')+'</div>'+
    '<div class="qr-title">'+esc(L(r))+'</div>'+
    '<div class="qr-score">'+(window.LANG==='en'?'Score':'得分')+' '+kscore+' / 10</div>'+
    '<div class="qr-desc">'+(window.LANG==='en'
      ? (best?'The Execution Bureau has its eye on you, cadet. Keep training — Bronze City awaits.'
          :'The library misses you. A few more volumes and you will be ready for the pitch.')
      : (best?'执行部已经注意到你了，学员。继续训练——青铜城在等你。'
          :'图书馆想你了。再多读几卷，就能上球场了。'))+'</div>'+
    '<div class="qr-foot">'+
      '<button class="qr-link" type="button" id="kRetry" style="cursor:pointer;">'+(window.LANG==='en'?'Retake':'再来一次')+'</button>'+
      '<button class="qr-link" type="button" id="kShare" style="cursor:pointer;">'+(window.LANG==='en'?'Share score card':'生成成绩分享卡')+'</button>'+
    '</div>';
  document.getElementById('kRetry').onclick=kstart;
  document.getElementById('kShare').onclick=drawShare;
}
function drawShare(){
  var c=document.getElementById('shareCanvas'); var ctx=c.getContext('2d');
  ctx.clearRect(0,0,720,420);
  var g=ctx.createLinearGradient(0,0,0,420);
  g.addColorStop(0,'#081120'); g.addColorStop(0.5,'#0d1e33'); g.addColorStop(1,'#160b12');
  ctx.fillStyle=g; ctx.fillRect(0,0,720,420);
  ctx.strokeStyle='rgba(216,181,117,.55)'; ctx.lineWidth=2;
  ctx.strokeRect(24,24,672,372);
  var img=new Image(); img.onload=function(){
    ctx.save(); ctx.beginPath(); ctx.arc(360,92,34,0,Math.PI*2); ctx.clip();
    ctx.drawImage(img,326,58,68,68); ctx.restore();
    ctx.strokeStyle='rgba(216,181,117,.8)'; ctx.beginPath(); ctx.arc(360,92,34,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#d8b575'; ctx.font='600 26px "Noto Serif SC",serif'; ctx.textAlign='center';
    ctx.fillText('CASSELL COLLEGE',360,152);
    ctx.fillStyle='#f4cf68'; ctx.font='600 40px "Noto Serif SC",serif';
    var r=krank();
    ctx.fillText(L(r),360,220);
    ctx.fillStyle='#dbe8f6'; ctx.font='20px "Noto Serif SC",serif';
    ctx.fillText((window.LANG==='en'?'Score: ':'得分：')+kscore+' / 10',360,268);
    ctx.fillStyle='#8b673c'; ctx.font='15px "Noto Serif SC",serif';
    var d=new Date();
    ctx.fillText('DRAGON RAJA · '+(d.getFullYear())+'/'+(d.getMonth()+1)+'/'+d.getDate(),360,340);
    var dl=document.getElementById('shareDl');
    dl.href=c.toDataURL('image/png');
    dl.textContent=window.LANG==='en'?'Download score card ⬇':'下载成绩卡 ⬇';
    document.getElementById('shareWrap').classList.add('show');
  };
  img.src='img/cassell-seal-round.png';
}

/* 标签切换 */
document.querySelectorAll('.quiz-tab').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.quiz-tab').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
    var t=b.getAttribute('data-q');
    document.getElementById('panel-person').classList.toggle('active',t==='person');
    document.getElementById('panel-know').classList.toggle('active',t==='know');
  };
});

prender();
kstart();
if(window.onLangChange)window.onLangChange(function(){
  var qn=document.getElementById('pNext');
  if(pIdx<9){ qn.textContent=window.LANG==='en'?'Next →':'下一题 →'; }
  document.getElementById('kNext').textContent=(ki===9)?(window.LANG==='en'?'See result →':'查看结果 →'):(window.LANG==='en'?'Next →':'下一题 →');
  prender(); krender();
});
</script>
</body>
