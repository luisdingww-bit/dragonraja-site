<header class="hero">

  <h1>龙族</h1>
  <div class="en">D R A G O N &nbsp; R A J A</div>
  <div class="quote" data-i18n="hero_quote">凡王之血，必以剑终</div>
  <p class="lead" data-i18n="hero_lead">世界上有一种生命，逆着时光的洪流而生。他们流淌着古老的龙血，在卡塞尔学院的钟声里，等待属于自己的言灵苏醒。</p>

<section id="world" class="container">
  <div class="sec-title"><span class="num">N ° 01</span><div class="kick">W O R L D V I E W</div><h2 data-i18n="s01_h2">世 界 观</h2><div class="sub" data-i18n="s01_sub">当龙血逆着时光流淌</div></div>
  <div class="diamond-row"><span class="ln"></span><span class="diamond"></span><span class="ln r"></span></div>
  <div class="world">
    <div class="art-frame"><img src="img/dragon-01.webp" alt="龙族史浮雕"><div class="cap">⟪ 龙族史浮雕 · 巨龙凌于残城之上 ⟫</div></div>
    <p data-i18n="world_p1">《龙族》是作家江南创作的奇幻小说系列。故事里，一群被称为“混血种”的少年在卡塞尔学院（Cassell College）的庇护下，与沉眠于世界各处的龙族后裔战斗。他们既背负人类的身份，又流淌着龙的血——是异类，也是屠龙者中最后的希望。</p>
    <p class="quote" data-i18n="world_quote">“每个人心里都有一条龙，有的人终其一生都在驯服它，而有的人，成了它的奴隶。”</p>
    <p data-i18n="world_p3">在这个世界里，“言灵”是混血种觉醒后能够释放的先天能力，每种言灵都有专属序列号：从最普通的“蛇”（序列号22），到灭世级的“烛龙”（序列号114）。而你，究竟是第几代混血种，又能否听见血脉深处的那一句言灵？</p>
    <div class="crest-line" data-i18n="crest_line">✦ 混血种名录 · 待你登记 ✦</div>
  </div>
</section>

<script>
(function(){const boot=document.getElementById('boot');const enter=document.getElementById('bootEnter'),bm=document.getElementById('bootMusic');let done=false;function syncBM(){if(!bm||!window.AP)return;const on=window.AP.isPlaying();bm.textContent=on?'❚❚':'♪';bm.classList.toggle('on',!!on);}function close(){if(done)return;done=true;boot.classList.add('hide');setTimeout(()=>boot.style.display='none',1050);}enter.addEventListener('click',()=>{close();if(window.AP)AP.play();syncBM();});if(bm)bm.addEventListener('click',()=>{if(!window.AP)return;if(window.AP.isPlaying())window.AP.pause();else window.AP.play();syncBM();});if(window.onLangChange)window.onLangChange(syncBM);syncBM();})();

const bloodData=[
  {id:"S",level:"S级混血种",level_en:"S-Class Hybrid",weight:6},
  {id:"SA",level:"超A级混血种",level_en:"Super-A Class Hybrid",weight:12},
  {id:"A",level:"A级混血种",level_en:"A-Class Hybrid",weight:18},
  {id:"B",level:"B级混血种",level_en:"B-Class Hybrid",weight:22},
  {id:"C",level:"C级混血种",level_en:"C-Class Hybrid",weight:22},
  {id:"D",level:"D级混血种",level_en:"D-Class Hybrid",weight:14},
  {id:"E",level:"E级微弱混血",level_en:"E-Class Faint Hybrid",weight:8},
  {id:"N",level:"普通人类，无龙血",level_en:"Ordinary Human, No Dragon Blood",weight:18}
];
const spirits=[
  {seq:114,name:"言灵·烛龙",name_en:"Spirit · Zhulong",desc:"序列号114，灭世级言灵，释放焚尽一切的赤红烈焰，足以摧毁城市。",desc_en:"Seq. 114. An apocalyptic-class spirit that unleashes city-consuming crimson flame.",high:true},
  {seq:113,name:"言灵·归墟",name_en:"Spirit · Guixu",desc:"序列号113，操控水流，制造无边海啸与水压，海洋领域的终极言灵。",desc_en:"Seq. 113. Commands water, raising boundless tsunamis and pressure — the ultimate ocean spirit.",high:true},
  {seq:91,name:"言灵·莱茵",name_en:"Spirit · Rhine",desc:"序列号91，制造极速声波共振，大范围爆破，短时间内产生毁灭性冲击波。",desc_en:"Seq. 91. Creates high-speed sonic resonance for wide-area blasts and shockwaves.",high:true},
  {seq:71,name:"言灵·君焰",name_en:"Spirit · Junyan",desc:"序列号71，楚子航的言灵，凝聚高热于刀刃，斩出焚城烈焰之剑。",desc_en:"Seq. 71. Chu Zihang's spirit — condenses heat onto the blade, slashing a city-burning flame sword.",high:false},
  {seq:59,name:"言灵·镰鼬",name_en:"Spirit · Kamaitachi",desc:"序列号59，路明非早期言灵，无形风刃切割范围内一切。",desc_en:"Seq. 59. Lu Mingfei's early spirit — invisible wind blades cut everything in range.",high:false},
  {seq:22,name:"言灵·蛇",name_en:"Spirit · Serpent",desc:"序列号22，释放带有神经毒素的雾气，麻痹敌人感官。",desc_en:"Seq. 22. Releases neurotoxic mist that paralyzes the enemy's senses.",high:false}
];
function sp(n){return spirits.find(s=>s.name===n);}
const spiritByBlood={
  "S级混血种":[sp("言灵·烛龙"),sp("言灵·归墟"),sp("言灵·莱茵")],
  "超A级混血种":[sp("言灵·莱茵"),sp("言灵·烛龙")],
  "A级混血种":[sp("言灵·君焰")],
  "B级混血种":[sp("言灵·君焰"),sp("言灵·镰鼬")],
  "C级混血种":[sp("言灵·镰鼬"),sp("言灵·蛇")],
  "D级混血种":[sp("言灵·蛇")],
  "E级微弱混血":[sp("言灵·蛇")],
  "普通人类，无龙血":[]
};
let nowBlood="",nowSpirit=null;
const bloodBtn=document.getElementById("checkBloodBtn"),spiritBtn=document.getElementById("callSpiritBtn"),resultBox=document.getElementById("resultBox"),bloodText=document.getElementById("bloodText"),spiritText=document.getElementById("spiritText"),spiritDesc=document.getElementById("spiritDesc"),scan=document.getElementById("scan"),scanBar=scan.querySelector('i'),scanTip=document.getElementById("scanTip");
function weightRandom(list){let t=list.reduce((s,i)=>s+i.weight,0);let r=Math.random()*t;for(let i of list){r-=i.weight;if(r<=0)return i;}return list[list.length-1];}
function seqLabel(){return window.LANG==='en'?'Seq.':'序列号';}
function shortName(s){return window.LANG==='en'?s.name_en.replace('Spirit · ',''):s.name.replace('言灵·','');}
function renderCodexGrid(){const g=document.getElementById('codexGrid');g.innerHTML='';spirits.forEach(s=>{const c=document.createElement('div');c.className='codex-card'+(s.high?' high':'');c.innerHTML=`<div class="seq">${seqLabel()} ${s.seq}</div><h3>${shortName(s)}</h3><p>${tr(s,'desc')}</p>`;if(s.high)c.setAttribute('data-high',t('high_badge'));g.appendChild(c);});}
bloodBtn.onclick=function(){bloodBtn.disabled=true;resultBox.style.display="none";spiritBtn.disabled=true;spiritText.innerText="";spiritDesc.innerText="";nowSpirit=null;scan.style.display="block";scanBar.style.width="0";scanTip.style.display="block";scanTip.textContent=window.MSG[window.LANG].scanning;let p=0;const tm=setInterval(()=>{p+=Math.random()*16+6;if(p>=100){p=100;clearInterval(tm);scanBar.style.width="100%";setTimeout(()=>{scan.style.display="none";scanTip.style.display="none";const res=weightRandom(bloodData);nowBlood=res.level;bloodText.innerText=tr(res,'level');resultBox.style.display="block";if(nowBlood==="普通人类，无龙血"){spiritBtn.disabled=true;spiritText.innerText=window.MSG[window.LANG].noSpirit;spiritDesc.innerText=window.MSG[window.LANG].noDragon;}else{spiritBtn.disabled=false;spiritText.innerText=window.MSG[window.LANG].notYet;spiritDesc.innerText=window.MSG[window.LANG].promptSummon;}bloodBtn.disabled=false;},350);}else{scanBar.style.width=p+"%";}},140);};
spiritBtn.onclick=function(){const pool=spiritByBlood[nowBlood];if(!pool||!pool.length){spiritText.innerText=window.MSG[window.LANG].noSpirit;spiritDesc.innerText=window.MSG[window.LANG].noDragon;return;}const s=pool[Math.floor(Math.random()*pool.length)];nowSpirit=s;spiritText.innerText=tr(s,'name');spiritDesc.innerText=tr(s,'desc');};
if(window.onLangChange)window.onLangChange(function(){renderCodexGrid();if(resultBox.style.display==="block"){const bObj=bloodData.find(b=>b.level===nowBlood);bloodText.innerText=bObj?tr(bObj,'level'):"";if(nowBlood==="普通人类，无龙血"){spiritText.innerText=window.MSG[window.LANG].noSpirit;spiritDesc.innerText=window.MSG[window.LANG].noDragon;}else if(nowSpirit){spiritText.innerText=tr(nowSpirit,'name');spiritDesc.innerText=tr(nowSpirit,'desc');}else{spiritText.innerText=window.MSG[window.LANG].notYet;spiritDesc.innerText=window.MSG[window.LANG].promptSummon;}}});
renderCodexGrid();
</script>
