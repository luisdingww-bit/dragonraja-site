<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重置密码 ｜ DRAGON RAJA</title>
<link rel="stylesheet" href="style.css?v=20260804-1553">
<link rel="icon" type="image/png" href="img/cassell-seal-round.png">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .rec-card{position:relative;width:min(460px,94vw);background:linear-gradient(180deg,#0b1728,#081020);border:1px solid var(--line-strong);box-shadow:0 24px 70px rgba(0,0,0,.6);padding:36px 30px;text-align:center;}
  .rec-card::before,.rec-card::after{content:"";position:absolute;width:20px;height:20px;border:1px solid var(--gold);}
  .rec-card::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
  .rec-card::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}
  .rec-crest{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;box-shadow:0 0 0 2px var(--gold-soft),0 0 20px rgba(216,181,117,.3);}
  .rec-crest img{width:100%;height:100%;border-radius:50%;object-fit:contain;}
  .rec-college{font-family:var(--serif);letter-spacing:.3em;color:var(--ink-bright);font-weight:700;font-size:15px;}
  .rec-h1{font-family:var(--serif);letter-spacing:.4em;color:var(--gold);font-size:20px;margin:10px 0 4px;}
  .rec-sub{color:var(--ink-dim);font-size:12px;letter-spacing:.12em;font-family:var(--serif);margin-bottom:22px;}
  .rec-form{display:flex;flex-direction:column;gap:12px;text-align:left;}
  .rec-form input{background:rgba(5,12,24,.72);border:1px solid var(--line-strong);color:var(--ink);font-family:var(--serif);font-size:14px;padding:12px 14px;border-radius:2px;outline:none;transition:.3s;}
  .rec-form input::placeholder{color:var(--ink-dim);}
  .rec-form input:focus{border-color:var(--gold);box-shadow:0 0 14px rgba(216,181,117,.22);}
  .rec-hint{color:var(--ink-dim);font-size:11.5px;line-height:1.8;font-family:var(--serif);min-height:18px;text-align:center;letter-spacing:.05em;}
  .rec-hint.err{color:#e0566a;}
  .rec-hint.ok{color:var(--gold-bright);}
  .rec-btn{background:linear-gradient(145deg,rgba(40,18,24,.9),rgba(14,7,10,.9));color:var(--ink);border:1px solid var(--line-strong);padding:13px 26px;font-family:var(--serif);font-size:14px;letter-spacing:.3em;cursor:pointer;border-radius:2px;transition:.3s;margin-top:6px;}
  .rec-btn:hover{border-color:var(--gold);color:var(--gold-bright);box-shadow:0 0 18px rgba(216,181,117,.25);}
  .rec-back{display:inline-block;margin-top:18px;color:var(--gold-soft);font-family:var(--serif);font-size:12px;letter-spacing:.2em;text-decoration:none;border-bottom:1px dashed rgba(216,181,117,.4);padding-bottom:2px;}
  .rec-back:hover{color:var(--gold-bright);}
  .rec-hide{display:none;}
</style>
</head>
<body>
<div class="rec-card">
  <div class="rec-crest"><img src="img/cassell-seal-round.png" alt="Cassell College"></div>
  <div class="rec-college">CASSELL COLLEGE</div>
  <div class="rec-h1" data-i18n="recover_h1">重 置 密 码</div>
  <div class="rec-sub" data-i18n="recover_sub">设置一个新密码，重新握紧你的档案</div>
  <form class="rec-form" id="recForm" autocomplete="off" novalidate>
    <input id="recPass" type="password" data-i18n-ph="recover_newpass_ph" placeholder="新密码 / New password" minlength="6" maxlength="64">
    <input id="recPass2" type="password" data-i18n-ph="recover_confirm_ph" placeholder="确认新密码 / Confirm new password" maxlength="64">
    <div class="rec-hint" id="recHint"></div>
    <button class="rec-btn" type="submit" data-i18n="recover_submit">设 置 新 密 码</button>
  </form>
  <a class="rec-back" href="index.html" data-i18n="recover_to_home">← 返回首页</a>
</div>

<script src="i18n.js?v=20260804-1553"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js?v=20260804-1553"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var hint = document.getElementById('recHint');
    var form = document.getElementById('recForm');
    var isSb = window.DR && window.DR.authMode === 'supabase';
    var hash = window.location.hash || '';
    var hasToken = /access_token=/.test(hash) && /type=recovery|type=magiclink/.test(hash);
    if (!isSb || !hasToken) {
      form.classList.add('rec-hide');
      hint.textContent = window.t('recover_nosb');
      hint.classList.add('err');
      return;
    }
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var p1 = document.getElementById('recPass').value || '';
      var p2 = document.getElementById('recPass2').value || '';
      hint.classList.remove('err', 'ok');
      if (p1.length < 6) { hint.textContent = window.t('reset_pass_short'); hint.classList.add('err'); return; }
      if (p1 !== p2) { hint.textContent = window.t('reset_confirm_err'); hint.classList.add('err'); return; }
      window.DR.auth.updatePassword({ password: p1 }).then(function () {
        hint.textContent = window.t('recover_done');
        hint.classList.add('ok');
        setTimeout(function () { window.location.href = 'index.html'; }, 1600);
      }).catch(function (err) {
        hint.textContent = (err && err.code === 'short') ? window.t('reset_pass_short') : ((err && err.message) || 'error');
        hint.classList.add('err');
      });
    });
  });
</script>
</body>
</html>
